<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-glow)" />

  <!-- Subtle border -->
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#27272a" stroke-width="1.5" />

  <!-- Center Content Group -->
  <g transform="translate(600, 250)">
    
    <!-- Shield + Braces Logo -->
    <g transform="translate(0, -70)">
      <!-- Shield Path (centered at 0,0) -->
      <path d="M 0 -60 L 45 -42 V 6 Q 45 42 0 56 Q -45 42 -45 6 V -42 Z" 
            fill="#0f172a" 
            stroke="url(#shield-grad)" 
            stroke-width="7" 
            stroke-linejoin="round" />
      
      <!-- Braces Text -->
      <text x="0" y="14" 
            text-anchor="middle" 
            font-family="ui-monospace, 'JetBrains Mono', monospace" 
            font-weight="700" 
            font-size="46" 
            fill="#ffffff">{ }</text>
    </g>

    <!-- Brand Name -->
    <text x="0" y="65" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, 'Inter', sans-serif" 
          font-weight="750" 
          font-size="64" 
          letter-spacing="-1.5" 
          fill="#f4f4f5">
      Quiet<tspan fill="#3b82f6">JSON</tspan>
    </text>

    <!-- Tagline -->
    <text x="0" y="125" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, 'Inter', sans-serif" 
          font-weight="500" 
          font-size="28" 
          letter-spacing="-0.3" 
          fill="#a1a1aa">
      Free, Private JSON Tools
    </text>

    <!-- Privacy Badge Pill -->
    <g transform="translate(0, 185)">
      <rect x="-190" y="-20" width="380" height="40" rx="20" fill="#18181b" stroke="#27272a" stroke-width="1.5" />
      <text x="0" y="7" 
            text-anchor="middle" 
            font-family="ui-monospace, 'JetBrains Mono', monospace" 
            font-weight="500" 
            font-size="16" 
            letter-spacing="0.5" 
            fill="#38bdf8">
        🔒 100% Client-Side · Zero Tracking
      </text>
    </g>

  </g>
</svg>